<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Talaad Thai Operations &amp; Analytics Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Taviraj', 'serif'],
          body: ['Sarabun', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      },
    },
  };
</script>

<style>
  html { scroll-behavior: smooth; }
  body { background-color: #F6F5F0; }

  .awning {
    height: 10px;
    background: repeating-linear-gradient(
      115deg,
      #17332C 0px, #17332C 26px,
      #F6F5F0 26px, #F6F5F0 30px,
      #C98A1F 30px, #C98A1F 56px,
      #F6F5F0 56px, #F6F5F0 60px
    );
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  a:focus-visible, button:focus-visible {
    outline: 2px solid #17332C;
    outline-offset: 3px;
    border-radius: 4px;
  }
</style>

<!-- React 18 + Babel standalone: lets this single file use JSX with no build step -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body class="font-body text-[#1B231F] antialiased">

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

const TOKENS = {
  green: "#17332C",
  cream: "#F6F5F0",
  gold: "#C98A1F",
};

function MarketMark() {
  return (
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
      <path d="M5 13 L18 5 L31 13" stroke="#17332C" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M6.5 13 L6.5 29 L29.5 29 L29.5 13" stroke="#17332C" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M12.5 29 L12.5 20 L23.5 20 L23.5 29" stroke="#C98A1F" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function ArrowIcon({ className }) {
  return (
    <svg className={className} width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <path d="M4 9 H14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
      <path d="M9.5 4.5 L14 9 L9.5 13.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function StatBadge({ label }) {
  return (
    <span className="inline-flex items-center gap-2 rounded-full border border-[#DCD2B4] bg-white/60 px-4 py-2 text-sm font-mono text-[#17332C]">
      <span className="h-1.5 w-1.5 rounded-full bg-[#C98A1F]"></span>
      {label}
    </span>
  );
}

function QuickStat({ value, label }) {
  return (
    <div className="flex flex-col items-center sm:items-start px-6 py-5 sm:border-l first:border-l-0 border-white/10">
      <span className="font-display text-3xl md:text-4xl font-semibold text-[#F6F5F0]">{value}</span>
      <span className="mt-1 text-xs md:text-sm text-[#F6F5F0]/70 font-mono text-center sm:text-left">{label}</span>
    </div>
  );
}

function DashboardCard({ accent, icon, title, description, tags, cta, href }) {
  const [hover, setHover] = useState(false);
  const style = {
    borderColor: hover ? accent : "#E4E1D5",
    boxShadow: hover
      ? "0 20px 40px -20px rgba(23, 51, 44, 0.35)"
      : "0 1px 2px rgba(23, 51, 44, 0.04)",
    transform: hover ? "translateY(-6px)" : "translateY(0px)",
  };
  return (
    <a
      href={href}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      className="group block bg-white rounded-xl border-t-4 p-8 flex flex-col h-full transition-all duration-300 ease-out no-underline"
      style={style}
    >
      <div
        className="mb-6 flex h-14 w-14 items-center justify-center rounded-lg"
        style={{ backgroundColor: `${accent}14` }}
      >
        {icon(accent)}
      </div>
      <h3 className="font-display text-2xl font-semibold text-[#17332C]">{title}</h3>
      <p className="mt-3 text-[15px] leading-relaxed text-[#5B6357] flex-1">{description}</p>
      <div className="mt-6 flex flex-wrap gap-2">
        {tags.map((tag) => (
          <span
            key={tag}
            className="rounded-full border px-3 py-1 text-xs font-mono"
            style={{ borderColor: `${accent}55`, color: accent }}
          >
            {tag}
          </span>
        ))}
      </div>
      <div
        className="mt-8 inline-flex items-center justify-between rounded-lg px-5 py-3.5 text-sm font-medium text-white transition-colors"
        style={{ backgroundColor: hover ? "#17332C" : accent }}
      >
        <span>{cta}</span>
        <ArrowIcon className="transition-transform duration-300 group-hover:translate-x-1" />
      </div>
    </a>
  );
}

function ShopIcon(color) {
  return (
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path d="M4 9 L13 4 L22 9" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M5 9 L5 21 L21 21 L21 9" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M9.5 21 L9.5 14.5 L16.5 14.5 L16.5 21" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx="13" cy="11.5" r="1.6" fill={color} />
    </svg>
  );
}

function FruitIcon(color) {
  return (
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path
        d="M13 10 C7.5 10 4.5 14.5 5.7 19 C6.7 22.7 10 25 13 25 C16 25 19.3 22.7 20.3 19 C21.5 14.5 18.5 10 13 10 Z"
        stroke={color}
        strokeWidth="2"
        strokeLinejoin="round"
      />
      <path d="M13 10 C12.2 6.8 13.5 4.3 16.4 2.7" stroke="#3F7A52" strokeWidth="2" strokeLinecap="round" />
    </svg>
  );
}

function VeggieIcon(color) {
  return (
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path
        d="M13 4 C20 4 22.5 12 19 19 C16 25 8.5 25.7 5.5 21.5 C2.5 17.3 3.5 9.5 9 6 C10.2 5.2 11.6 4.5 13 4 Z"
        stroke={color}
        strokeWidth="2"
        strokeLinejoin="round"
      />
      <path d="M13 4 C10.5 11 8 16 5 20.5" stroke={color} strokeWidth="1.4" strokeLinecap="round" />
    </svg>
  );
}

function App() {
  return (
    <div className="min-h-screen bg-[#F6F5F0] text-[#1B231F] font-body antialiased">
      <div className="awning" aria-hidden="true"></div>

      <header className="border-b border-[#E4E1D5]">
        <div className="max-w-6xl mx-auto px-6 md:px-10 py-5 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <MarketMark />
            <span className="font-display text-lg font-semibold tracking-tight text-[#17332C]">ตลาดไท</span>
          </div>
          <span className="hidden sm:block font-mono text-xs text-[#5B6357]">Talaad Thai Data Systems</span>
        </div>
      </header>

      <main>
        <section className="max-w-4xl mx-auto px-6 md:px-10 pt-20 pb-14 text-center">
          <h1 className="font-display font-semibold leading-[1.08] text-4xl sm:text-5xl md:text-[3.4rem]">
            Talaad Thai
            <span className="block text-[#17332C]">Operations &amp; Analytics Hub</span>
          </h1>
          <p className="mt-6 text-[#5B6357] text-base md:text-lg leading-relaxed max-w-2xl mx-auto">
            ศูนย์กลางเชื่อมโยงระบบข้อมูลตลาดเกษตรไทยทั้งสามด้าน ตั้งแต่การรับรองคุณภาพร้านค้า
            ไปจนถึงแนวโน้มราคาและปริมาณผลผลิตผลไม้และผักสด เพื่อสนับสนุนการตัดสินใจของผู้ประกอบการ
            และผู้บริหารตลาดในที่เดียว
          </p>
          <div className="mt-8 flex flex-wrap items-center justify-center gap-3">
            <StatBadge label="3 ระบบเชื่อมโยง" />
            <StatBadge label="GAP · GMP · HACCP" />
            <StatBadge label="ร้านค้า · ผลไม้ · ผัก" />
          </div>
        </section>

        <section className="max-w-6xl mx-auto px-6 md:px-10">
          <div className="rounded-2xl bg-[#17332C] px-6 md:px-10 py-8">
            <div className="grid grid-cols-2 sm:grid-cols-4 divide-y sm:divide-y-0 divide-white/10">
              <QuickStat value="195" label="ร้านค้าขึ้นทะเบียน" />
              <QuickStat value="12" label="โซนตลาดที่ครอบคลุม" />
              <QuickStat value="3" label="ระบบข้อมูลเชื่อมโยง" />
              <QuickStat value="3" label="มาตรฐานที่รองรับ" />
            </div>
          </div>
        </section>

        <section className="max-w-6xl mx-auto px-6 md:px-10 pt-14 pb-24">
          <div className="grid md:grid-cols-3 gap-6">
            <DashboardCard
              accent={TOKENS.green}
              icon={ShopIcon}
              title="ระบบติดตามร้าน Q-Shop"
              description="ตรวจสอบสถานะการรับรองคุณภาพของร้านค้าในตลาดไท ครอบคลุมมาตรฐาน GAP, GMP และ HACCP พร้อมภาพรวมจำนวนร้านค้าที่ผ่านและใกล้หมดอายุการรับรอง"
              tags={["สถานะร้านค้า", "อายุใบรับรอง"]}
              cta="เข้าสู่ระบบติดตามร้าน"
              href="qshop.html"
            />
            <DashboardCard
              accent={TOKENS.gold}
              icon={FruitIcon}
              title="แนวโน้มผลไม้ไทย"
              description="ติดตามแนวโน้มราคาและปริมาณผลไม้ตามฤดูกาล พร้อมการประเมินความเสี่ยงจากปรากฏการณ์เอลนีโญที่อาจกระทบผลผลิตในแต่ละช่วงปี"
              tags={["ราคา/ปริมาณ", "ความเสี่ยงเอลนีโญ"]}
              cta="ดูแนวโน้มผลไม้"
              href="fruit-trends.html"
            />
            <DashboardCard
              accent="#3F7A52"
              icon={VeggieIcon}
              title="แนวโน้มผักไทย"
              description="คลังข้อมูลผักสดของตลาดไท รวมรายชนิด ปริมาณผลผลิต และการกระจายตัวของแหล่งเพาะปลูก สำหรับวิเคราะห์อุปทานเชิงลึก"
              tags={["ชนิดผัก", "แหล่งเพาะปลูก"]}
              cta="เปิดคลังข้อมูลผัก"
              href="veg-trends.html"
            />
          </div>
        </section>
      </main>

      <footer className="border-t border-[#E4E1D5]">
        <div className="max-w-6xl mx-auto px-6 md:px-10 py-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
          <span className="font-mono text-xs text-[#5B6357]">Talaad Thai Operations &amp; Analytics Hub</span>
          <span className="font-mono text-xs text-[#5B6357]">qshop.html · fruit-trends.html · veg-trends.html</span>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
